<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>WineFolio — Ta cave</title>
<meta name="theme-color" content="#F4ECE1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="WineFolio" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="assets/logo180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F4ECE1; --card:#FFFFFF; --card-border:#EFE7DE;
  --ink:#3A3A3E; --ink-soft:#8A8478;
  --wine:#E7C9CF; --wine-dark:#7A2E3B;
  --gold:#C99A3E; --sage-dark:#6FA084; --loss:#D97757;
  --radius:20px; --radius-sm:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:40px;}
button{font-family:inherit;}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;padding-top:max(12px,env(safe-area-inset-top));position:sticky;top:0;background:rgba(244,236,225,0.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid var(--card-border);}
.brand-mark{height:58px;width:58px;border-radius:14px;display:block;}
.header-actions{display:flex;align-items:center;gap:8px;}
.btn-reset{display:flex;align-items:center;gap:5px;background:transparent;border:1.5px solid var(--card-border);color:var(--ink-soft);padding:9px 12px;border-radius:999px;font-weight:600;font-size:13px;cursor:pointer;}
.btn-primary{display:flex;align-items:center;gap:6px;background:var(--wine-dark);color:#fff;border:none;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s ease;}
.btn-primary:active{transform:scale(0.97);}
.btn-full{width:100%;justify-content:center;padding:14px;font-size:15px;}
.btn-ghost-full{width:100%;justify-content:center;padding:13px;font-size:14px;}

.container{max-width:1100px;margin:0 auto;padding:20px;}

.view-switch{display:flex;background:var(--card);border:1px solid var(--card-border);border-radius:999px;padding:4px;margin-bottom:16px;}
.view-switch button{flex:1;border:none;background:transparent;padding:9px;border-radius:999px;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;color:var(--ink-soft);cursor:pointer;}
.view-switch button.active{background:var(--wine-dark);color:#fff;}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:14px 16px;}
.stat-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-soft);margin:0 0 6px;}
.stat-value{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin:0;}
.stat-value.accent{color:var(--wine-dark);}
.stat-value.ok{color:var(--sage-dark);}

.toolbar{display:flex;gap:10px;margin-bottom:14px;}
#searchInput,#sortSelect{padding:11px 14px;border-radius:999px;border:1px solid var(--card-border);background:var(--card);font-family:'Inter',sans-serif;font-size:14px;outline:none;color:var(--ink);}
#searchInput{flex:1;min-width:0;}
#searchInput:focus{border-color:var(--wine);}

.chips{display:flex;gap:8px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.filter-chip{flex-shrink:0;padding:8px 16px;border-radius:999px;border:1.5px solid var(--card-border);background:var(--card);color:var(--ink-soft);font-weight:600;font-size:13.5px;cursor:pointer;}
.filter-chip.active{background:var(--wine-dark);border-color:var(--wine-dark);color:#fff;}
.chips + .grid, .chips + .empty-state{margin-top:8px;}

.empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);border:1.5px dashed var(--card-border);border-radius:var(--radius);}
.empty-state p{margin:0;}
.empty-sub{font-size:14px;margin-top:4px !important;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;}
.ticket{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;}
.ticket:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(122,46,59,0.12);}
.ticket-image{aspect-ratio:4/5;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;}
.ticket-image img{width:100%;height:100%;object-fit:contain;padding:6px;}
.ticket-image .ph{width:26%;height:auto;opacity:0.16;}
.qty-badge{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;padding:3px 8px;border-radius:999px;}
.ticket-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
.ticket-brand{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticket-model{font-family:'Oswald',sans-serif;font-weight:600;font-size:17px;margin:0;line-height:1.2;}
.ticket-meta{font-size:13px;color:var(--ink-soft);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ticket-divider{border-top:1.5px dashed var(--card-border);padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);margin-top:auto;}
.ticket-divider strong{color:var(--ink);font-weight:600;}
.mini-stars{color:var(--gold);letter-spacing:1px;}

.status-badge{display:flex;align-items:center;justify-content:center;padding:7px 10px;border-radius:10px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;}
.s-boire{background:rgba(111,160,132,0.15);color:var(--sage-dark);}
.s-attendre{background:rgba(201,154,62,0.15);color:var(--gold);}
.s-fin{background:rgba(217,119,87,0.15);color:var(--loss);}
.s-bue{background:rgba(122,46,59,0.10);color:var(--wine-dark);}

/* Overlays */
.modal-overlay{position:fixed;inset:0;height:100vh;height:100dvh;background:rgba(58,58,62,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
.modal-overlay[hidden]{display:none;}
.sheet{background:var(--card);width:100%;max-width:440px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:24px 24px 0 0;position:relative;animation:up .25s ease;}
.sheet.form{background:var(--bg);max-width:480px;}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media(min-width:640px){.modal-overlay{align-items:center;}.sheet{border-radius:24px;}}

.detail-close{position:absolute;top:14px;right:14px;z-index:5;width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.95);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;}
.detail-image{aspect-ratio:4/5;max-height:52vh;width:100%;background:#fff;display:flex;align-items:center;justify-content:center;}
.detail-image img{width:100%;height:100%;object-fit:contain;padding:24px;}
.detail-image .ph{width:22%;height:auto;opacity:0.16;}
.detail-body{padding:20px 24px calc(26px + env(safe-area-inset-bottom));}
.detail-brand{font-family:'IBM Plex Mono',monospace;font-size:11.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:0 0 4px;}
.detail-model{font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;line-height:1.15;margin:0 0 6px;}
.detail-meta{font-size:14.5px;color:var(--ink-soft);margin:0;}
.detail-size{font-size:14.5px;font-weight:600;margin:4px 0 0;}
.detail-divider{border-top:1.5px dashed var(--card-border);margin:18px 0;}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.price-block{background:var(--bg);border-radius:14px;padding:14px 16px;}
.mono-label{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:0 0 4px;}
.price-value{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;margin:0;}
.price-value.accent{color:var(--wine-dark);}
.status-row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:14px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;margin-bottom:12px;}
.status-row .lbl{font-family:'Inter',sans-serif;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);}
.qty-row{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px;padding:10px 12px 10px 16px;margin-bottom:12px;}
.stepper{display:flex;align-items:center;gap:12px;}
.stepper button{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--card-border);background:#fff;font-size:18px;color:var(--wine-dark);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.stepper span{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;min-width:20px;text-align:center;}
.rating-block{background:var(--bg);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
.big-stars{display:flex;gap:4px;margin-top:4px;}
.big-stars button{background:none;border:none;padding:0;font-size:28px;line-height:1;color:#E2D9CE;cursor:pointer;}
.big-stars button.on{color:var(--gold);}
.community{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--card-border);}
.community strong{font-family:'IBM Plex Mono',monospace;font-size:17px;color:var(--wine-dark);}
.community span{font-size:12.5px;color:var(--ink-soft);}
.detail-extra{display:flex;flex-direction:column;gap:8px;margin:4px 0 14px;}
.extra-row{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-soft);}
.extra-row span:last-child{color:var(--ink);font-weight:600;font-family:'IBM Plex Mono',monospace;text-align:right;}
.detail-notes{font-size:13.5px;color:var(--ink-soft);background:var(--bg);border-radius:12px;padding:12px 14px;margin:0 0 12px;line-height:1.45;}
.detail-notes b{color:var(--ink);}
.detail-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px;}

/* Form sheet */
.sheet-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--card-border);z-index:2;}
.sheet-header h2{font-family:'Oswald',sans-serif;font-size:19px;margin:0;}
.icon-btn{width:32px;height:32px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,0.12);}
.sheet-body{padding:18px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;}
.sheet-body label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--ink-soft);}
.sheet-body input,.sheet-body textarea,.sheet-body select{font-family:'Inter',sans-serif;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--card-border);background:#fff;color:var(--ink);outline:none;width:100%;-webkit-appearance:none;appearance:none;}
.sheet-body input:focus,.sheet-body textarea:focus,.sheet-body select:focus{border-color:var(--wine-dark);}
.sheet-body textarea{resize:none;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft);margin:8px 0 0;}
.paste-block{display:flex;flex-direction:column;gap:8px;}
.btn-paste{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--wine-dark);background:rgba(122,46,59,0.06);color:var(--wine-dark);font-weight:600;font-size:14px;cursor:pointer;}
.link-btn{background:none;border:none;color:var(--ink-soft);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:0;align-self:center;}
.mono-area{font-family:'IBM Plex Mono',monospace !important;font-size:12px !important;}

.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s ease;z-index:300;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(max-width:480px){
  .container{padding:16px 14px;}
  .stats{gap:8px;}
  .stat-card{padding:11px 12px;}
  .stat-label{font-size:9.5px;}
  .stat-value{font-size:15px;}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;}
  .ticket{border-radius:16px;}
  .ticket-body{padding:10px 11px 12px;gap:6px;}
  .ticket-brand{font-size:9px;}
  .ticket-model{font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ticket-meta{font-size:11.5px;}
  .ticket-divider{font-size:10.5px;padding-top:6px;}
  .status-badge{font-size:9.5px;padding:6px 6px;}
}
</style>
</head>
<body>

<header class="topbar">
  <img src="assets/logo.png" alt="WineFolio" class="brand-mark" />
  <div class="header-actions">
    <button id="dataBtn" class="btn-reset" aria-label="Sauvegarde">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Données
    </button>
    <button id="addBtn" class="btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
      Ajouter
    </button>
  </div>
</header>

<main class="container">
  <div class="view-switch" id="viewSwitch">
    <button class="active" data-view="cellar">Ma cave</button>
    <button data-view="history">Déjà bues</button>
  </div>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Rechercher un vin…" />
    <select id="sortSelect">
      <option value="recent">Plus récent</option>
      <option value="urgency">À boire en premier</option>
      <option value="value">Valeur ↓</option>
      <option value="rating">Ma note ↓</option>
      <option value="vintage">Millésime ↑</option>
      <option value="name">Nom A→Z</option>
    </select>
  </div>

  <div class="chips" id="colorChips">
    <button class="filter-chip active" data-color="all">Tous</button>
    <button class="filter-chip" data-color="rouge">Rouge</button>
    <button class="filter-chip" data-color="blanc">Blanc</button>
    <button class="filter-chip" data-color="rose">Rosé</button>
    <button class="filter-chip" data-color="petillant">Effervescent</button>
    <button class="filter-chip" data-color="liquoreux">Liquoreux</button>
  </div>
  <div class="chips" id="statusChips">
    <button class="filter-chip active" data-status="all">Tous statuts</button>
    <button class="filter-chip" data-status="boire">À boire</button>
    <button class="filter-chip" data-status="attendre">À garder</button>
    <button class="filter-chip" data-status="fin">À boire vite</button>
  </div>

  <div id="emptyState" class="empty-state" hidden>
    <p id="emptyTitle">Ta cave est vide.</p>
    <p class="empty-sub" id="emptySub">Ajoute ta première bouteille pour démarrer.</p>
  </div>
  <div id="grid" class="grid"></div>
</main>

<!-- Fiche détail -->
<div id="detailOverlay" class="modal-overlay" hidden>
  <div class="sheet" id="detailSheet"></div>
</div>

<!-- Formulaire -->
<div id="formOverlay" class="modal-overlay" hidden>
  <div class="sheet form">
    <div class="sheet-header">
      <h2 id="formTitle">Ajouter une bouteille</h2>
      <button class="icon-btn" data-close="formOverlay" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="wineForm" class="sheet-body" autocomplete="off">
      <input type="hidden" id="fId" />
      <div class="paste-block" id="pasteBlock">
        <button type="button" class="btn-paste" id="clipboardBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="8" y="3" width="8" height="4" rx="1" stroke="currentColor" stroke-width="2"/><path d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-2" stroke="currentColor" stroke-width="2"/></svg>
          Coller la fiche donnée par Claude
        </button>
        <button type="button" class="link-btn" id="manualPasteToggle">ou coller manuellement</button>
        <div id="manualPasteBox" hidden>
          <textarea id="pasteArea" rows="4" class="mono-area" placeholder='{"name":"…","producer":"…"}'></textarea>
          <button type="button" class="btn-primary btn-ghost-full" id="pasteAddBtn" style="margin-top:8px;">Ajouter depuis le texte</button>
        </div>
      </div>

      <p class="section-title">Le vin</p>
      <label>Nom du vin *<input type="text" id="fName" placeholder="Santenay 1er Cru La Comme" required /></label>
      <label>Domaine / producteur<input type="text" id="fProducer" placeholder="Domaine Louis Lequin" /></label>
      <div class="row2">
        <label>Millésime<input type="number" inputmode="numeric" id="fVintage" placeholder="2019" /></label>
        <label>Couleur
          <select id="fColor">
            <option value="rouge">Rouge</option><option value="blanc">Blanc</option><option value="rose">Rosé</option>
            <option value="petillant">Effervescent</option><option value="liquoreux">Liquoreux</option>
          </select>
        </label>
      </div>
      <label>Région / appellation<input type="text" id="fRegion" placeholder="Bourgogne — Côte de Beaune" /></label>
      <label>URL de l'image<input type="url" id="fImage" placeholder="https://…" /></label>

      <p class="section-title">Cave</p>
      <div class="row2">
        <label>Quantité<input type="number" inputmode="numeric" id="fQty" min="1" value="1" /></label>
        <label>Prix unitaire (€)<input type="number" inputmode="decimal" id="fPrice" min="0" step="0.5" placeholder="35" /></label>
      </div>
      <div class="row2">
        <label>Apogée — dès<input type="number" inputmode="numeric" id="fFrom" placeholder="2024" /></label>
        <label>Apogée — jusqu'à<input type="number" inputmode="numeric" id="fTo" placeholder="2030" /></label>
      </div>

      <p class="section-title">Notes</p>
      <div class="row3">
        <label>Note /10<input type="number" inputmode="decimal" id="fComRating" min="0" max="10" step="0.1" placeholder="8.0" /></label>
        <label>Votes<input type="number" inputmode="numeric" id="fComVotes" min="0" placeholder="120" /></label>
        <label>Source<input type="text" id="fComSource" placeholder="Vivino" /></label>
      </div>
      <label>Note perso<textarea id="fNote" rows="3" placeholder="Cadeau, occasion, impressions de dégustation…"></textarea></label>

      <button type="submit" class="btn-primary btn-full" id="formSubmit">Enregistrer</button>
    </form>
  </div>
</div>

<!-- Données -->
<div id="dataOverlay" class="modal-overlay" hidden>
  <div class="sheet form">
    <div class="sheet-header">
      <h2>Sauvegarde des données</h2>
      <button class="icon-btn" data-close="dataOverlay" aria-label="Fermer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="sheet-body">
      <p class="detail-meta">Tes bouteilles sont stockées sur cet appareil. Copie ce texte et garde-le (notes, mail…) pour ne jamais rien perdre.</p>
      <button class="btn-primary btn-full" id="copyExportBtn">Copier toute ma cave</button>
      <textarea id="exportText" rows="7" readonly class="mono-area"></textarea>
      <p class="section-title">Restaurer</p>
      <textarea id="importText" rows="4" class="mono-area" placeholder="Colle ici une sauvegarde…"></textarea>
      <button class="btn-reset btn-ghost-full" id="importBtn">Restaurer cette sauvegarde</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY_CELLAR = 'winefolio-bottles-v1';
const KEY_HISTORY = 'winefolio-history-v1';
const COLORS = {rouge:'Rouge',blanc:'Blanc',rose:'Rosé',petillant:'Effervescent',liquoreux:'Liquoreux'};
const PAIRINGS = {
  rouge:"Viandes rouges, gibier, plats mijotés, fromages affinés.",
  blanc:"Poissons, fruits de mer, volaille, fromages de chèvre.",
  rose:"Apéritif, salades, grillades, cuisine méditerranéenne.",
  petillant:"Apéritif, fruits de mer, desserts peu sucrés.",
  liquoreux:"Foie gras, fromages bleus, desserts aux fruits."
};
const BOTTLE_SVG = '<svg class="ph" viewBox="0 0 40 120" fill="none"><path d="M15 2h10v28c0 6 9 10 9 22v62a4 4 0 01-4 4H10a4 4 0 01-4-4V52c0-12 9-16 9-22V2z" fill="#3A3A3E"/></svg>';

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function load(key){
  let arr = [];
  try{ arr = JSON.parse(localStorage.getItem(key) || '[]'); }catch(e){ arr = []; }
  if(!Array.isArray(arr)) arr = [];
  arr.forEach(b => { if(!b.id) b.id = uid(); });
  return arr;
}
let cellar = load(KEY_CELLAR);
let history = load(KEY_HISTORY);
let state = {view:'cellar', color:'all', status:'all', search:'', sort:'recent', openId:null};

function persist(){
  try{
    localStorage.setItem(KEY_CELLAR, JSON.stringify(cellar));
    localStorage.setItem(KEY_HISTORY, JSON.stringify(history));
  }catch(e){ toast('Erreur de sauvegarde'); }
}
persist();

const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function num(v){ const n = Number(v); return (v === '' || v === null || v === undefined || isNaN(n)) ? null : n; }
function eur(v){ return (Number(v)||0).toLocaleString('fr-FR',{maximumFractionDigits:0}) + ' €'; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

function statusOf(b){
  const y = new Date().getFullYear();
  if(!b.drinkFrom && !b.drinkTo) return 'attendre';
  if(b.drinkFrom && y < b.drinkFrom) return 'attendre';
  if(b.drinkTo && y > b.drinkTo) return 'fin';
  if(b.drinkTo && y === b.drinkTo) return 'fin';
  return 'boire';
}
const STATUS_LABEL = {boire:'À boire', attendre:'À garder', fin:'À boire vite'};
function windowText(b){ return (b.drinkFrom||b.drinkTo) ? `${b.drinkFrom||'?'} – ${b.drinkTo||'?'}` : 'Non renseignée'; }
function miniStars(r){ return r ? '★'.repeat(r) : ''; }
function imgHtml(b){
  return b.image ? `<img src="${esc(b.image)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{innerHTML:BOTTLE_SVG}).firstChild)">` : BOTTLE_SVG;
}
function list(){ return state.view === 'cellar' ? cellar : history; }

/* ---------- Rendu principal ---------- */
function renderStats(){
  if(state.view === 'cellar'){
    const count = cellar.reduce((s,b)=>s+(Number(b.qty)||0),0);
    const value = cellar.reduce((s,b)=>s+(Number(b.qty)||0)*(Number(b.price)||0),0);
    const ready = cellar.filter(b=>statusOf(b)!=='attendre').reduce((s,b)=>s+(Number(b.qty)||0),0);
    $('stats').innerHTML = `
      <div class="stat-card"><p class="stat-label">Bouteilles</p><p class="stat-value">${count}</p></div>
      <div class="stat-card"><p class="stat-label">Valeur</p><p class="stat-value accent">${eur(value)}</p></div>
      <div class="stat-card"><p class="stat-label">À boire</p><p class="stat-value ok">${ready}</p></div>`;
  } else {
    const rated = history.filter(b=>b.myRating);
    const avg = rated.length ? (rated.reduce((s,b)=>s+b.myRating,0)/rated.length).toFixed(1) : '—';
    const spent = history.reduce((s,b)=>s+(Number(b.price)||0),0);
    $('stats').innerHTML = `
      <div class="stat-card"><p class="stat-label">Dégustés</p><p class="stat-value">${history.length}</p></div>
      <div class="stat-card"><p class="stat-label">Note moy.</p><p class="stat-value accent">${avg}${avg!=='—'?'/5':''}</p></div>
      <div class="stat-card"><p class="stat-label">Valeur bue</p><p class="stat-value">${eur(spent)}</p></div>`;
  }
}

function render(){
  renderStats();
  $('statusChips').style.display = state.view === 'cellar' ? '' : 'none';
  let items = list().slice();
  const q = state.search.trim().toLowerCase();
  if(q) items = items.filter(b => [b.name,b.producer,b.region,b.vintage].join(' ').toLowerCase().includes(q));
  if(state.color !== 'all') items = items.filter(b => b.color === state.color);
  if(state.view === 'cellar' && state.status !== 'all') items = items.filter(b => statusOf(b) === state.status);

  const rank = {fin:0,boire:1,attendre:2};
  const sorters = {
    recent: (a,b)=> (b.consumedAt||b.addedAt||0) - (a.consumedAt||a.addedAt||0),
    urgency:(a,b)=> rank[statusOf(a)]-rank[statusOf(b)] || (a.drinkTo||9999)-(b.drinkTo||9999),
    value:  (a,b)=> (b.price||0)*(b.qty||1) - (a.price||0)*(a.qty||1),
    rating: (a,b)=> (b.myRating||0) - (a.myRating||0),
    vintage:(a,b)=> (a.vintage||9999) - (b.vintage||9999),
    name:   (a,b)=> String(a.name).localeCompare(String(b.name),'fr')
  };
  items.sort(sorters[state.sort] || sorters.recent);

  const empty = items.length === 0;
  $('emptyState').hidden = !empty;
  if(empty){
    const filtered = list().length > 0;
    $('emptyTitle').textContent = filtered ? 'Aucun vin ne correspond.' : (state.view==='cellar' ? 'Ta cave est vide.' : 'Aucune bouteille bue pour l\u2019instant.');
    $('emptySub').textContent = filtered ? 'Change de filtre ou de recherche.' : (state.view==='cellar' ? 'Ajoute ta première bouteille pour démarrer.' : 'Quand une bouteille arrive à 0, elle atterrit ici.');
  }

  $('grid').innerHTML = items.map(b => {
    const isH = state.view === 'history';
    const st = statusOf(b);
    const badge = isH
      ? `<div class="status-badge s-bue">Bue le ${b.consumedAt ? new Date(b.consumedAt).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit'}) : '—'}</div>`
      : `<div class="status-badge s-${st}">${STATUS_LABEL[st]}</div>`;
    const left = b.myRating ? `<span class="mini-stars">${miniStars(b.myRating)}</span>` : (b.communityRating ? `<span>${b.communityRating}/10</span>` : `<span>${esc(COLORS[b.color]||'')}</span>`);
    return `
      <article class="ticket" data-id="${b.id}">
        <div class="ticket-image">${imgHtml(b)}${!isH && Number(b.qty)>1 ? `<span class="qty-badge">×${b.qty}</span>`:''}</div>
        <div class="ticket-body">
          <p class="ticket-brand">${esc(b.producer||'—')}</p>
          <p class="ticket-model">${esc(b.name)}</p>
          <p class="ticket-meta">${[b.vintage, b.region].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</p>
          <div class="ticket-divider">${left}<strong>${b.price ? eur(b.price) : '—'}</strong></div>
          ${badge}
        </div>
      </article>`;
  }).join('');

  if(state.openId) renderDetail();
}

/* ---------- Fiche détail ---------- */
function findOpen(){
  let b = cellar.find(x=>x.id===state.openId);
  if(b) return {b, isH:false};
  b = history.find(x=>x.id===state.openId);
  return b ? {b, isH:true} : null;
}
function openDetail(id){ state.openId = id; renderDetail(); $('detailOverlay').hidden = false; document.body.style.overflow='hidden'; }
function closeDetail(){ state.openId = null; $('detailOverlay').hidden = true; document.body.style.overflow=''; }

function renderDetail(){
  const f = findOpen(); if(!f){ closeDetail(); return; }
  const {b, isH} = f; const st = statusOf(b);
  const stars = [1,2,3,4,5].map(i=>`<button data-act="rate" data-v="${i}" class="${i<=(b.myRating||0)?'on':''}" aria-label="${i} étoiles">★</button>`).join('');
  const community = b.communityRating ? `
    <div class="community"><span>Communauté${b.communitySource?' · '+esc(b.communitySource):''}</span>
    <div><strong>${b.communityRating}/10</strong>${b.communityVotes?` <span>(${b.communityVotes} votes)</span>`:''}</div></div>` : '';
  $('detailSheet').innerHTML = `
    <button class="detail-close" data-act="close" aria-label="Fermer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <div class="detail-image">${imgHtml(b)}</div>
    <div class="detail-body">
      <p class="detail-brand">${esc(b.producer||'—')}</p>
      <h2 class="detail-model">${esc(b.name)}</h2>
      <p class="detail-meta">${esc(b.region||'')}</p>
      <p class="detail-size">${b.vintage ? 'Millésime '+b.vintage : ''}${b.vintage?' · ':''}${esc(COLORS[b.color]||'')}</p>
      <div class="detail-divider"></div>

      <div class="price-grid">
        <div class="price-block"><p class="mono-label">Prix unitaire</p><p class="price-value">${b.price ? eur(b.price) : '—'}</p></div>
        <div class="price-block"><p class="mono-label">${isH?'Apogée':'Valeur en cave'}</p><p class="price-value accent">${isH ? esc(windowText(b)) : (b.price ? eur(b.price*(b.qty||0)) : '—')}</p></div>
      </div>

      ${isH
        ? `<div class="status-row s-bue"><span class="lbl">Bue le</span><span>${b.consumedAt?new Date(b.consumedAt).toLocaleDateString('fr-FR'):'—'}</span></div>`
        : `<div class="status-row s-${st}"><span class="lbl">Apogée ${esc(windowText(b))}</span><span>${STATUS_LABEL[st]}</span></div>
           <div class="qty-row"><span class="mono-label" style="margin:0;">En cave</span>
             <div class="stepper"><button data-act="dec" aria-label="Moins">−</button><span>${b.qty||0}</span><button data-act="inc" aria-label="Plus">+</button></div></div>`}

      <div class="rating-block">
        <p class="mono-label">Ma note</p>
        <div class="big-stars">${stars}</div>
        ${community}
      </div>

      <p class="detail-notes"><b>Accord :</b> ${PAIRINGS[b.color]||'—'}</p>
      ${b.note ? `<p class="detail-notes">${esc(b.note)}</p>` : ''}

      <div class="detail-actions">
        <button class="btn-primary btn-full" data-act="edit">Modifier</button>
        ${isH
          ? `<button class="btn-reset btn-ghost-full" data-act="restore">Remettre une bouteille en cave</button>
             <button class="btn-reset btn-ghost-full" data-act="delete" style="color:var(--loss)">Supprimer de l'historique</button>`
          : `<button class="btn-reset btn-ghost-full" data-act="delete" style="color:var(--loss)">Retirer de la cave</button>`}
      </div>
    </div>`;
}

$('detailSheet').addEventListener('click', e => {
  const btn = e.target.closest('[data-act]'); if(!btn) return;
  const f = findOpen(); if(!f) return; const {b, isH} = f;
  switch(btn.dataset.act){
    case 'close': closeDetail(); break;
    case 'rate': { const v = Number(btn.dataset.v); b.myRating = b.myRating === v ? 0 : v; persist(); render(); break; }
    case 'inc': b.qty = (Number(b.qty)||0) + 1; persist(); render(); break;
    case 'dec': {
      const q = (Number(b.qty)||0) - 1;
      if(q <= 0){
        cellar = cellar.filter(x=>x.id!==b.id);
        history.push({...b, qty:0, consumedAt:Date.now()});
        persist(); closeDetail(); render(); toast('Dernière bouteille bue · rangée dans « Déjà bues »');
      } else { b.qty = q; persist(); render(); toast('Une de moins — santé !'); }
      break;
    }
    case 'edit': openForm(b.id); break;
    case 'restore': {
      const existing = cellar.find(x => x.name===b.name && x.producer===b.producer && x.vintage===b.vintage);
      if(existing) existing.qty = (Number(existing.qty)||0) + 1;
      else cellar.push({...b, id:uid(), qty:1, consumedAt:undefined, addedAt:Date.now()});
      persist(); toast('Remise en cave'); render(); break;
    }
    case 'delete':
      if(!confirm(isH ? 'Supprimer ce vin de l\u2019historique ?' : 'Retirer complètement ce vin de la cave (sans le marquer comme bu) ?')) return;
      if(isH) history = history.filter(x=>x.id!==b.id); else cellar = cellar.filter(x=>x.id!==b.id);
      persist(); closeDetail(); render(); toast('Supprimé'); break;
  }
});

/* ---------- Formulaire ---------- */
const FIELDS = {fName:'name',fProducer:'producer',fVintage:'vintage',fColor:'color',fRegion:'region',fImage:'image',fQty:'qty',fPrice:'price',fFrom:'drinkFrom',fTo:'drinkTo',fComRating:'communityRating',fComVotes:'communityVotes',fComSource:'communitySource',fNote:'note'};
const NUMERIC = ['vintage','qty','price','drinkFrom','drinkTo','communityRating','communityVotes'];

function openForm(id){
  $('wineForm').reset(); $('fId').value = id || ''; $('manualPasteBox').hidden = true;
  const f = id ? (cellar.find(x=>x.id===id) || history.find(x=>x.id===id)) : null;
  $('formTitle').textContent = f ? 'Modifier la bouteille' : 'Ajouter une bouteille';
  $('pasteBlock').style.display = f ? 'none' : '';
  if(f) for(const [el,k] of Object.entries(FIELDS)) $(el).value = f[k] ?? '';
  if(f && history.includes(f)) $('fQty').closest('label').style.display='none'; else $('fQty').closest('label').style.display='';
  $('formOverlay').hidden = false; document.body.style.overflow='hidden';
}
function closeForm(){ $('formOverlay').hidden = true; if($('detailOverlay').hidden) document.body.style.overflow=''; }

$('wineForm').addEventListener('submit', e => {
  e.preventDefault();
  const data = {};
  for(const [el,k] of Object.entries(FIELDS)){
    const v = $(el).value.trim();
    data[k] = NUMERIC.includes(k) ? num(v) : v;
  }
  if(!data.name) return;
  const id = $('fId').value;
  if(id){
    const target = cellar.find(x=>x.id===id) || history.find(x=>x.id===id);
    if(history.includes(target)) delete data.qty;
    Object.assign(target, data);
    toast('Bouteille mise à jour');
  } else {
    cellar.push(normalize(data));
    toast('Ajoutée à la cave');
  }
  persist(); closeForm(); render();
});

function normalize(item){
  const o = {id:uid(), addedAt:Date.now(), myRating:0};
  o.name = String(item.name||'').trim();
  ['producer','region','image','note','communitySource'].forEach(k=> o[k] = item[k] ? String(item[k]).trim() : '');
  o.color = COLORS[item.color] ? item.color : 'rouge';
  NUMERIC.forEach(k=> o[k] = num(item[k]));
  if(!o.qty || o.qty < 1) o.qty = 1;
  if(item.myRating) o.myRating = Math.min(5, Math.max(0, Number(item.myRating)||0));
  return o;
}
function addFromText(text){
  let data;
  try{ data = JSON.parse(text.trim().replace(/^```(json)?|```$/g,'')); }catch(e){ toast('Format non reconnu'); return false; }
  const items = (Array.isArray(data) ? data : [data]).filter(x=>x && x.name);
  if(!items.length){ toast('Aucun vin trouvé dans le texte'); return false; }
  items.forEach(it => cellar.push(normalize(it)));
  persist(); closeForm(); state.view='cellar'; syncViewButtons(); render();
  toast(items.length===1 ? 'Ajoutée à la cave' : items.length+' bouteilles ajoutées');
  return true;
}
$('clipboardBtn').addEventListener('click', async () => {
  try{ const t = await navigator.clipboard.readText(); addFromText(t); }
  catch(e){ $('manualPasteBox').hidden = false; toast('Colle le texte dans la zone ci-dessous'); }
});
$('manualPasteToggle').addEventListener('click', ()=> $('manualPasteBox').hidden = !$('manualPasteBox').hidden);
$('pasteAddBtn').addEventListener('click', ()=> { if(addFromText($('pasteArea').value)) $('pasteArea').value=''; });

/* ---------- Données ---------- */
$('dataBtn').addEventListener('click', ()=>{
  $('exportText').value = JSON.stringify({cellar, history}, null, 1);
  $('importText').value = '';
  $('dataOverlay').hidden = false; document.body.style.overflow='hidden';
});
$('copyExportBtn').addEventListener('click', async ()=>{
  try{ await navigator.clipboard.writeText($('exportText').value); toast('Cave copiée'); }
  catch(e){ $('exportText').select(); toast('Sélectionne et copie le texte'); }
});
$('importBtn').addEventListener('click', ()=>{
  let d; try{ d = JSON.parse($('importText').value); }catch(e){ toast('Sauvegarde invalide'); return; }
  const c = Array.isArray(d) ? d : d.cellar; const h = Array.isArray(d) ? history : (d.history||[]);
  if(!Array.isArray(c)){ toast('Sauvegarde invalide'); return; }
  if(!confirm('Remplacer la cave actuelle par cette sauvegarde ?')) return;
  cellar = c.map(b=>({...b, id:b.id||uid()})); history = h.map(b=>({...b, id:b.id||uid()}));
  persist(); $('dataOverlay').hidden = true; document.body.style.overflow=''; render(); toast('Sauvegarde restaurée');
});

/* ---------- Navigation & filtres ---------- */
function syncViewButtons(){ document.querySelectorAll('#viewSwitch button').forEach(x=>x.classList.toggle('active', x.dataset.view===state.view)); }
$('viewSwitch').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.view = b.dataset.view; syncViewButtons(); render();
});
$('colorChips').addEventListener('click', e=>{
  const b = e.target.closest('.filter-chip'); if(!b) return;
  state.color = b.dataset.color; document.querySelectorAll('#colorChips .filter-chip').forEach(x=>x.classList.toggle('active', x===b)); render();
});
$('statusChips').addEventListener('click', e=>{
  const b = e.target.closest('.filter-chip'); if(!b) return;
  state.status = b.dataset.status; document.querySelectorAll('#statusChips .filter-chip').forEach(x=>x.classList.toggle('active', x===b)); render();
});
$('searchInput').addEventListener('input', e=>{ state.search = e.target.value; render(); });
$('sortSelect').addEventListener('change', e=>{ state.sort = e.target.value; render(); });
$('grid').addEventListener('click', e=>{ const t = e.target.closest('.ticket'); if(t) openDetail(t.dataset.id); });
$('addBtn').addEventListener('click', ()=> openForm(null));

document.querySelectorAll('[data-close]').forEach(b=> b.addEventListener('click', ()=>{ $(b.dataset.close).hidden = true; if($('detailOverlay').hidden) document.body.style.overflow=''; }));
['detailOverlay','formOverlay','dataOverlay'].forEach(id => $(id).addEventListener('click', e=>{
  if(e.target.id !== id) return;
  if(id==='detailOverlay') closeDetail(); else { $(id).hidden = true; if($('detailOverlay').hidden) document.body.style.overflow=''; }
}));

/* ---------- Bouteilles ajoutées par Claude (data/cave.json du repo) ---------- */
const KEY_IMPORTED = 'winefolio-imported-v1';
async function syncFromRepo(){
  let remote;
  try{
    const r = await fetch('data/cave.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return; remote = await r.json();
  }catch(e){ return; }
  if(!Array.isArray(remote)) return;
  let seen = []; try{ seen = JSON.parse(localStorage.getItem(KEY_IMPORTED) || '[]'); }catch(e){}
  const key = b => [b.name,b.producer,b.vintage].join('|').toLowerCase();
  const existing = new Set([...cellar, ...history].map(key));
  let added = 0;
  remote.forEach(item => {
    if(!item || !item.id || !item.name || seen.includes(item.id)) return;
    seen.push(item.id);
    if(existing.has(key(item))) return;
    const b = normalize(item); b.id = item.id; cellar.push(b); existing.add(key(b)); added++;
  });
  localStorage.setItem(KEY_IMPORTED, JSON.stringify(seen));
  if(added){ persist(); render(); toast(added === 1 ? 'Nouvelle bouteille ajoutée par Claude' : added + ' nouvelles bouteilles ajoutées'); }
}
document.addEventListener('visibilitychange', () => { if(!document.hidden) syncFromRepo(); });

render();
syncFromRepo();
</script>
